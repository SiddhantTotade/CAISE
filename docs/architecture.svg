<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1290" role="img" aria-labelledby="title desc">
  <title id="title">CAISE architecture service call map</title>
  <desc id="desc">A row-by-row map of CAISE direct service calls. The request path is Browser to FastAPI, then FastAPI to Qdrant, SQLite, and the LLM. The indexing path is FastAPI to Redis, then Celery to Redis, Git, Semgrep, Qdrant, and SQLite.</desc>
  <style>
    :root { --fg:#172033; --muted:#475569; --border:#64748b; --panel:#f8fafc; --browser:#bae6fd; --api:#bbf7d0; --data:#ddd6fe; --ai:#fde68a; --queue:#fed7aa; --worker:#fbcfe8; --git:#cffafe; --scan:#fecdd3; --arrow:#2563eb; --write:#15803d; }
    @media (prefers-color-scheme: dark) { :root { --fg:#f8fafc; --muted:#cbd5e1; --border:#94a3b8; --panel:#172033; --browser:#075985; --api:#166534; --data:#5b21b6; --ai:#92400e; --queue:#9a3412; --worker:#9d174d; --git:#155e75; --scan:#9f1239; --arrow:#7dd3fc; --write:#86efac; } }
    text { fill:var(--fg); font-family:"Comic Sans MS", "Segoe Print", "Trebuchet MS", sans-serif; }
    .title { font-size:25px; font-weight:700; }
    .heading { font-size:20px; font-weight:700; }
    .label { font-size:19px; font-weight:700; }
    .detail { font-size:14px; fill:var(--muted); }
    .action { font-size:15px; font-weight:700; }
    .panel { fill:var(--panel); stroke:var(--border); stroke-width:2; stroke-dasharray:8 7; }
    .node { stroke:var(--fg); stroke-width:2.5; stroke-linejoin:round; }
    .call { fill:none; stroke:var(--arrow); stroke-width:3.5; stroke-linecap:round; marker-end:url(#call-head); }
    .write { fill:none; stroke:var(--write); stroke-width:3.5; stroke-linecap:round; marker-end:url(#write-head); }
  </style>
  <defs>
    <marker id="call-head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--arrow)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="write-head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--write)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text x="42" y="42" class="title">CAISE architecture — who calls what</text>
  <text x="42" y="68" class="detail">One row shows one direct caller, dependency, and action. Blue = call/read. Green = index write.</text>

  <rect class="panel" x="30" y="94" width="1020" height="492" rx="20"/>
  <text x="58" y="132" class="heading">A. Search and chat</text>
  <text x="58" y="155" class="detail">The browser calls FastAPI only. FastAPI controls retrieval, metadata lookup, and model generation.</text>

  <rect class="node" x="80" y="190" width="230" height="72" rx="14" fill="var(--browser)"/>
  <text x="195" y="222" text-anchor="middle" class="label">React browser</text>
  <text x="195" y="245" text-anchor="middle" class="detail">question or chat action</text>
  <rect class="node" x="720" y="190" width="230" height="72" rx="14" fill="var(--api)"/>
  <text x="835" y="222" text-anchor="middle" class="label">FastAPI API</text>
  <text x="835" y="245" text-anchor="middle" class="detail">authentication + SSE</text>
  <path class="call" d="M312 226 H710"/>
  <text x="510" y="209" text-anchor="middle" class="action" fill="var(--arrow)">send API request</text>

  <rect class="node" x="80" y="292" width="230" height="72" rx="14" fill="var(--api)"/>
  <text x="195" y="335" text-anchor="middle" class="label">FastAPI API</text>
  <path class="node" d="M720 302 Q835 282 950 302 L950 354 Q835 374 720 354 Z" fill="var(--data)"/>
  <text x="835" y="335" text-anchor="middle" class="label">Qdrant vectors</text>
  <path class="call" d="M312 328 H710"/>
  <text x="510" y="311" text-anchor="middle" class="action" fill="var(--arrow)">retrieve allowed code chunks</text>

  <rect class="node" x="80" y="394" width="230" height="72" rx="14" fill="var(--api)"/>
  <text x="195" y="437" text-anchor="middle" class="label">FastAPI API</text>
  <path class="node" d="M720 404 Q835 384 950 404 L950 456 Q835 476 720 456 Z" fill="var(--data)"/>
  <text x="835" y="437" text-anchor="middle" class="label">SQLite metadata</text>
  <path class="call" d="M312 430 H710"/>
  <text x="510" y="413" text-anchor="middle" class="action" fill="var(--arrow)">load chat and repository metadata</text>

  <rect class="node" x="80" y="496" width="230" height="72" rx="14" fill="var(--api)"/>
  <text x="195" y="539" text-anchor="middle" class="label">FastAPI API</text>
  <rect class="node" x="720" y="496" width="230" height="72" rx="14" fill="var(--ai)"/>
  <text x="835" y="528" text-anchor="middle" class="label">LLM provider</text>
  <text x="835" y="551" text-anchor="middle" class="detail">Ollama or cloud model</text>
  <path class="call" d="M312 532 H710"/>
  <text x="510" y="515" text-anchor="middle" class="action" fill="var(--arrow)">send grounded prompt</text>

  <rect class="panel" x="30" y="612" width="1020" height="638" rx="20"/>
  <text x="58" y="650" class="heading">B. Repository indexing</text>
  <text x="58" y="673" class="detail">FastAPI queues the job. The Celery worker performs every remaining indexing action.</text>

  <rect class="node" x="80" y="708" width="230" height="72" rx="14" fill="var(--api)"/>
  <text x="195" y="751" text-anchor="middle" class="label">FastAPI API</text>
  <rect class="node" x="720" y="708" width="230" height="72" rx="14" fill="var(--queue)"/>
  <text x="835" y="751" text-anchor="middle" class="label">Redis queue</text>
  <path class="call" d="M312 744 H710"/>
  <text x="510" y="727" text-anchor="middle" class="action" fill="var(--arrow)">enqueue indexing job</text>

  <rect class="node" x="80" y="810" width="230" height="72" rx="14" fill="var(--worker)"/>
  <text x="195" y="853" text-anchor="middle" class="label">Celery worker</text>
  <rect class="node" x="720" y="810" width="230" height="72" rx="14" fill="var(--queue)"/>
  <text x="835" y="853" text-anchor="middle" class="label">Redis queue</text>
  <path class="call" d="M312 846 H710"/>
  <text x="510" y="829" text-anchor="middle" class="action" fill="var(--arrow)">consume indexing job</text>

  <rect class="node" x="80" y="912" width="230" height="72" rx="14" fill="var(--worker)"/>
  <text x="195" y="955" text-anchor="middle" class="label">Celery worker</text>
  <rect class="node" x="720" y="912" width="230" height="72" rx="14" fill="var(--git)"/>
  <text x="835" y="944" text-anchor="middle" class="label">Git repository</text>
  <text x="835" y="967" text-anchor="middle" class="detail">selected branch</text>
  <path class="call" d="M312 948 H710"/>
  <text x="510" y="931" text-anchor="middle" class="action" fill="var(--arrow)">clone or pull source code</text>

  <rect class="node" x="80" y="1014" width="230" height="72" rx="14" fill="var(--worker)"/>
  <text x="195" y="1057" text-anchor="middle" class="label">Celery worker</text>
  <rect class="node" x="720" y="1014" width="230" height="72" rx="14" fill="var(--scan)"/>
  <text x="835" y="1057" text-anchor="middle" class="label">Semgrep scan</text>
  <path class="call" d="M312 1050 H710"/>
  <text x="510" y="1033" text-anchor="middle" class="action" fill="var(--arrow)">scan cloned source code</text>

  <rect class="node" x="80" y="1116" width="230" height="72" rx="14" fill="var(--worker)"/>
  <text x="195" y="1159" text-anchor="middle" class="label">Celery worker</text>
  <path class="node" d="M720 1126 Q835 1106 950 1126 L950 1178 Q835 1198 720 1178 Z" fill="var(--data)"/>
  <text x="835" y="1159" text-anchor="middle" class="label">Qdrant vectors</text>
  <path class="write" d="M312 1152 H710"/>
  <text x="510" y="1135" text-anchor="middle" class="action" fill="var(--write)">upsert chunks and embeddings</text>

  <rect class="node" x="80" y="1218" width="230" height="72" rx="14" fill="var(--worker)"/>
  <text x="195" y="1261" text-anchor="middle" class="label">Celery worker</text>
  <path class="node" d="M720 1228 Q835 1208 950 1228 L950 1280 Q835 1300 720 1280 Z" fill="var(--data)"/>
  <text x="835" y="1261" text-anchor="middle" class="label">SQLite metadata</text>
  <path class="write" d="M312 1254 H710"/>
  <text x="510" y="1237" text-anchor="middle" class="action" fill="var(--write)">update repository and job status</text>
</svg>
